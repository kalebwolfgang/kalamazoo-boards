name: Tests

# Runs the notice reader tests. Nothing to do by hand: this runs itself
# whenever the scraper or the tests change, and there is a Run workflow button
# on the Actions tab if you want to run it on demand.
#
# A green check means the notice reader still handles every wording the city
# has used, and still refuses the strings that are not meetings. A red X means
# something broke, and the log names which case failed.

on:
  push:
    paths:
      - 'scripts/scraper.py'
      - 'tests/**'
  pull_request:
    paths:
      - 'scripts/scraper.py'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests jsonschema

      - name: Run notice tests
        run: python tests/test_notices.py
